services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: saga_sm
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d saga_sm"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata: