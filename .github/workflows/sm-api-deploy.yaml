name: sm_api_deploy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - for_deploy
    paths:
      - "apps/api/**"
  push:
    branches:
      - main
      - for_deploy
    paths:
      - "apps/api/**"

env:
  AWS_REGION: "us-west-2"
  AWS_ACCOUNT_ID: "531314149529"
  ECS_CLUSTER_ARN: "arn:aws:ecs:us-west-2:531314149529:cluster/shared-dev-cluster-and-loadbalancer-Cluster-QuyVOhruiTXD"
  ECS_SERVICE_NAME: "saga-sm-api"
  ECR_REPOSITORY: "saga-sm-api"

permissions:
  id-token: write # This is required for requesting the JWT
  contents: write # This is required for actions/checkout
  actions: read # This is required for actions/checkout

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout saga-soa dependency
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/saga-soa # Update this to your actual saga-soa repository path
          path: saga-soa
          token: ${{ secrets.GITHUB_TOKEN }} # You may need a PAT if it's a private repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install pnpm
        run: npm install -g pnpm@8.15.4

      - name: Build docker image
        run: |
          echo "Building docker image for SM2 API"
          # Build from project root to include both sm2 and saga-soa in build context
          docker build \
            -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest \
            -f apps/api/Dockerfile \
            .
          echo "Docker image built"

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/aws-github-actions-access-microservices-Role-11KE1BB99FYGU
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          echo "Logging in to ECR"
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          echo "Logged in to ECR"

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }}

      - name: Push to ECR
        run: |
          echo "Pushing to ECR"
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          echo "Pushed to ECR"

      - name: Deploy to ECS
        run: |
          echo "Deploying to ECS"
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER_ARN }} --service ${{ env.ECS_SERVICE_NAME }} --force-new-deployment
          echo "Deployed to ECS"
