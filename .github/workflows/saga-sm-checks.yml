name: CI/CD checks

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "8"

jobs:
  # Quick validation job - runs unit tests and linting without database
  lint-and-unit-tests:
    name: 🧹 Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history for better analysis
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 📦 Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build saga-soa dependencies
        run: ./scripts/build-saga-soa.sh

      - name: 🏗️ Generate Prisma client
        run: |
          cd packages/database
          npx prisma generate --schema ./prisma/schema.prisma
          pnpm build

      - name: 🏗️ Build API types
        run: |
          cd apps/api/types  
          pnpm build

      - name: 🏗️ Build API
        run: |
          cd apps/api
          pnpm build

      - name: 🧹 Lint code
        run: |
          cd apps/api
          pnpm lint

      - name: 🔍 Type check
        run: |
          cd apps/api  
          pnpm typecheck

      - name: 🧪 Run unit tests
        run: |
          cd apps/api
          pnpm test:unit

  # Full integration testing with real databases
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Database services for integration testing
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saga_sm
          POSTGRES_USER: saga_user
          POSTGRES_PASSWORD: password123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password123
          MONGO_INITDB_DATABASE: saga_sm
        options: >-
          --health-cmd mongosh --eval "db.runCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

      redis:
        image: redis:7.0-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 📦 Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build saga-soa dependencies
        run: ./scripts/build-saga-soa.sh

      - name: 🗄️ Setup database schema
        run: |
          cd packages/database
          echo "Generating Prisma client..."
          npx prisma generate --schema ./prisma/schema.prisma
          echo "Setting up database schema..."
          DATABASE_URL="postgresql://saga_user:password123@localhost:5432/saga_sm" \
            npx prisma db push --schema ./prisma/schema.prisma --accept-data-loss
          pnpm build
        env:
          DATABASE_URL: postgresql://saga_user:password123@localhost:5432/saga_sm

      - name: 🏗️ Build API
        run: |
          cd apps/api/types
          pnpm build
          cd ..
          pnpm build

      - name: 🧪 Run integration tests
        run: |
          cd apps/api
          pnpm test:integration
        env:
          DATABASE_URL: postgresql://saga_user:password123@localhost:5432/saga_sm
          MONGODB_URI: mongodb://admin:password123@localhost:27017/saga_sm?authSource=admin

  # Full test suite - runs after both unit and integration tests pass
  full-test-suite:
    name: 🎯 Full Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saga_sm
          POSTGRES_USER: saga_user
          POSTGRES_PASSWORD: password123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password123
          MONGO_INITDB_DATABASE: saga_sm
        options: >-
          --health-cmd mongosh --eval "db.runCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build all components
        run: |
          ./scripts/build-saga-soa.sh
          cd packages/database
          npx prisma generate --schema ./prisma/schema.prisma
          DATABASE_URL="postgresql://saga_user:password123@localhost:5432/saga_sm" \
            npx prisma db push --schema ./prisma/schema.prisma --accept-data-loss
          pnpm build
          cd ../../apps/api/types
          pnpm build
          cd ..
          pnpm build

      - name: 🧪 Run complete test suite with coverage
        run: |
          cd apps/api
          pnpm test:all
          pnpm test:coverage
        env:
          DATABASE_URL: postgresql://saga_user:password123@localhost:5432/saga_sm
          MONGODB_URI: mongodb://admin:password123@localhost:27017/saga_sm?authSource=admin

      - name: 📊 Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 30

  # Summary job to provide clear status
  ci-status:
    name: ✅ CI Status
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests, integration-tests]
    if: always()

    steps:
      - name: ✅ Success
        if: ${{ needs.lint-and-unit-tests.result == 'success' && needs.integration-tests.result == 'success' }}
        run: |
          echo "🎉 All CI checks passed!"
          echo "✅ Linting and unit tests: PASSED"
          echo "✅ Integration tests: PASSED"

      - name: ❌ Failure
        if: ${{ needs.lint-and-unit-tests.result != 'success' || needs.integration-tests.result != 'success' }}
        run: |
          echo "❌ CI checks failed!"
          echo "Lint & Unit Tests: ${{ needs.lint-and-unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          exit 1
