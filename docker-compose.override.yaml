# Development overrides for docker-compose
# This file is automatically used by docker-compose for local development

version: '3.8'

services:
  # Development-specific API overrides
  api:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      # Enable hot reload by mounting source code
      - ./apps/api/src:/app/apps/api/src:ro
      - ./apps/api/package.json:/app/apps/api/package.json:ro
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json:ro
      - ./apps/api/tsup.config.ts:/app/apps/api/tsup.config.ts:ro

  # Development-specific web client overrides
  web-client:
    environment:
      NODE_ENV: development
    volumes:
      # Enable hot reload by mounting source code
      - ./apps/web-client/app:/app/apps/web-client/app:ro
      - ./apps/web-client/src:/app/apps/web-client/src:ro
      - ./apps/web-client/package.json:/app/apps/web-client/package.json:ro
      - ./apps/web-client/tsconfig.json:/app/apps/web-client/tsconfig.json:ro
      - ./apps/web-client/next.config.js:/app/apps/web-client/next.config.js:ro

  # Add adminer for database management in development
  adminer:
    image: adminer:4.8.1
    container_name: saga-sm-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - saga-sm-network
    environment:
      ADMINER_DEFAULT_SERVER: mysql


